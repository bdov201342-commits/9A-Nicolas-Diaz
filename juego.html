<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Nico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg-primary:#0a0a1a;--surface:rgba(255,255,255,0.05);--surface-border:rgba(255,255,255,0.1);--glass-bg:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.12);--text-main:#f0f0f5;--text-secondary:#a0a0b8;--accent-primary:#7c3aed;--accent-secondary:#06b6d4;--danger:#ef4444;--gradient-primary:linear-gradient(135deg,#7c3aed,#06b6d4);--gradient-bg:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);--font-main:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--font-display:'Space Grotesk','Inter',sans-serif;--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 32px rgba(0,0,0,0.4);--shadow-lg:0 16px 48px rgba(0,0,0,0.5);--shadow-glow-purple:0 0 30px rgba(124,58,237,0.3);--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-main)}
        html{scroll-behavior:smooth}
        body{background:var(--bg-primary);background:var(--gradient-bg);background-attachment:fixed;color:var(--text-main);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;position:relative}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,rgba(124,58,237,0.15) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(6,182,212,0.1) 0%,transparent 40%),radial-gradient(circle at 50% 50%,rgba(236,72,153,0.08) 0%,transparent 40%);animation:bgFloat 20s ease-in-out infinite;z-index:0;pointer-events:none}
        ::selection{background:var(--accent-primary);color:white}
        ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent-primary),var(--accent-secondary));border-radius:4px}
        @keyframes bgFloat{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(30px,-30px) rotate(1deg)}66%{transform:translate(-20px,20px) rotate(-1deg)}}
        @keyframes slideUpFade{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes growLine{from{width:0}to{width:100%}}
        @keyframes textShine{0%{background-position:-200% center}100%{background-position:200% center}}
        @keyframes canvasGlow{0%,100%{box-shadow:0 0 20px rgba(124,58,237,0.3),inset 0 0 20px rgba(0,0,0,0.3)}50%{box-shadow:0 0 40px rgba(124,58,237,0.5),0 0 60px rgba(6,182,212,0.3),inset 0 0 20px rgba(0,0,0,0.3)}}
        @keyframes pop{0%{opacity:0;transform:scale(0.6)}100%{opacity:1;transform:scale(1)}}
        .animado{animation:slideUpFade 0.8s cubic-bezier(0.16,1,0.3,1) both}
        header.animado{animation-delay:0.1s}
        header{background:rgba(10,10,26,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:24px 40px;display:flex;flex-direction:column;align-items:center;gap:20px;position:sticky;top:0;z-index:100}
        header h1{font-family:var(--font-display);font-size:2.2rem;font-weight:700;letter-spacing:-1px;background:var(--gradient-primary);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:textShine 3s linear infinite}
        .nav-principal{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
        .btn-nav{color:var(--text-secondary);padding:10px 20px;text-decoration:none;font-weight:500;font-size:0.9rem;border-radius:var(--radius-full);position:relative;transition:var(--transition)}
        .btn-nav::after{content:'';position:absolute;bottom:2px;left:50%;width:0;height:2px;background:var(--gradient-primary);border-radius:2px;transition:var(--transition);transform:translateX(-50%)}
        .btn-nav:hover{color:var(--text-main);background:var(--surface)}
        .btn-nav:hover::after,.btn-nav.active::after{width:60%}
        .btn-nav.active{color:var(--text-main);background:var(--surface)}
        .user-status-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--glass-border);padding:8px 20px;border-radius:var(--radius-full);font-weight:500;font-size:0.85rem;color:var(--text-secondary);animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.5s both}
        .btn-logout{color:var(--danger);font-weight:700;background:transparent;border:none;cursor:pointer;transition:var(--transition);font-size:0.85rem}
        .btn-logout:hover{background:rgba(239,68,68,0.15);color:#ff6b6b;transform:none;box-shadow:none}
        .main-wrapper{flex:1;width:100%;max-width:1100px;margin:40px auto;padding:0 20px;position:relative;z-index:1}
        .seccion-caja{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);padding:40px;margin-bottom:30px;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);transition:var(--transition);position:relative;overflow:hidden}
        .seccion-caja::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient-primary);opacity:0;transition:var(--transition)}
        .seccion-caja:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg),0 0 30px rgba(124,58,237,0.1);border-color:rgba(124,58,237,0.2)}
        .seccion-caja:hover::before{opacity:1}
        .h-titulo{font-family:var(--font-display);font-size:1.6rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:24px;position:relative;display:inline-block;padding-bottom:12px}
        .h-titulo::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gradient-primary);border-radius:3px;animation:growLine 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s both}
        #gameCanvas{background:#09090b;border:2px solid rgba(124,58,237,0.4);border-radius:var(--radius-lg);display:block;margin:0 auto 24px auto;animation:canvasGlow 3s ease-in-out infinite}
        #game-over{animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;padding:30px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-lg);margin-top:20px}
        #game-over h3{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-bottom:16px}
        button,.btn{display:inline-block;background:var(--surface);color:var(--text-main);border:1px solid var(--surface-border);padding:12px 24px;cursor:pointer;text-decoration:none;font-size:0.9rem;font-weight:600;border-radius:var(--radius-md);transition:var(--transition);text-align:center;position:relative;overflow:hidden;user-select:none;font-family:var(--font-main)}
        button:hover,.btn:hover{background:var(--surface-hover);border-color:rgba(255,255,255,0.2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
        button:active,.btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);transition-duration:0.1s}
        .btn-exito{background:var(--gradient-primary);color:white;border:none;font-weight:700;box-shadow:var(--shadow-sm)}
        .btn-exito:hover{background:linear-gradient(135deg,#6d28d9,#0891b2);color:white;box-shadow:var(--shadow-glow-purple);transform:translateY(-2px)}
        :focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}}
        @media(max-width:768px){header h1{font-size:1.8rem}.seccion-caja{padding:28px 20px}#gameCanvas{width:100%;height:auto}}
    </style>
</head>
<body>
  <header class="animado">
    <h1>Snake Game</h1>
    <nav class="nav-principal">
      <a href="index.html" class="btn-nav">Inicio</a>
      <a href="juego.html" class="btn-nav active">Jugar</a>
      <a href="diario.html" class="btn-nav">Diario</a>
      <a href="tareas.html" class="btn-nav">Tareas</a>
    </nav>
  </header>
  <div class="main-wrapper">
    <div class="seccion-caja animado" style="text-align:center;">
      <h2 class="h-titulo">Puntuación: <span id="score" style="background:var(--gradient-primary);-webkit-background-clip:text;background-clip:text;color:transparent;">0</span></h2>
      <p style="color:var(--text-secondary);margin-bottom:20px;">Usa las <strong style="color:var(--accent-primary);">flechas del teclado</strong> para mover la serpiente.</p>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="game-over" style="display:none;">
        <h3 style="color:var(--danger);">¡Juego Terminado!</h3>
        <button onclick="reiniciarJuego()" class="btn-exito">Jugar de nuevo</button>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const u=localStorage.getItem('usuarioActivo');
      if(!u){window.location.href='registro.html';return;}
      const nav=document.querySelector('.nav-principal');
      if(nav){const b=document.createElement('div');b.className='user-status-bar';b.innerHTML=`<span>${u}</span><button onclick="if(confirm('¿Salir?')){localStorage.removeItem('usuarioActivo');window.location.href='registro.html';}" class="btn-logout">Cerrar Sesión</button>`;nav.appendChild(b);}
      iniciarJuego();
    });

    const canvas=document.getElementById("gameCanvas");
    const ctx=canvas.getContext("2d");
    let box=20,snake=[{x:9*box,y:10*box}],food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box},score=0,d,game;

    document.addEventListener("keydown",e=>{let k=e.keyCode;if(k==37&&d!="RIGHT")d="LEFT";else if(k==38&&d!="DOWN")d="UP";else if(k==39&&d!="LEFT")d="RIGHT";else if(k==40&&d!="UP")d="DOWN";});

    function collision(h,a){for(let i=0;i<a.length;i++){if(h.x==a[i].x&&h.y==a[i].y)return true;}return false;}

    function draw(){
      ctx.fillStyle="#09090b";ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let i=0;i<snake.length;i++){ctx.fillStyle=i==0?"#7c3aed":"#6d28d9";ctx.fillRect(snake[i].x,snake[i].y,box,box);ctx.strokeStyle="#1a1a2e";ctx.strokeRect(snake[i].x,snake[i].y,box,box);}
      ctx.fillStyle="#06b6d4";ctx.shadowColor="#06b6d4";ctx.shadowBlur=10;ctx.fillRect(food.x,food.y,box,box);ctx.shadowBlur=0;
      let sx=snake[0].x,sy=snake[0].y;
      if(d=="LEFT")sx-=box;if(d=="UP")sy-=box;if(d=="RIGHT")sx+=box;if(d=="DOWN")sy+=box;
      if(sx==food.x&&sy==food.y){score++;document.getElementById('score').innerText=score;food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box};}else{snake.pop();}
      let nh={x:sx,y:sy};
      if(sx<0||sx>=canvas.width||sy<0||sy>=canvas.height||collision(nh,snake)){clearInterval(game);document.getElementById('game-over').style.display='block';}
      snake.unshift(nh);
    }

    function iniciarJuego(){d=null;score=0;document.getElementById('score').innerText=score;snake=[{x:9*box,y:10*box}];document.getElementById('game-over').style.display='none';game=setInterval(draw,100);}
    function reiniciarJuego(){iniciarJuego();}
  </script>
</body>
</html>
